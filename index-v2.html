<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Value Bet Pro - Sniper V2</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .config { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        label { display: inline-block; width: 180px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Sniper V2 Configuration</h1>
    <div class="config">
        <label>ROI Historique (%) :</label>
        <select id="roi">
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="25" selected>25%</option>
            <option value="30">30%</option>
            <option value="35">35%</option>
        </select><br><br>
        
        <label>Win Rate (%) :</label>
        <select id="winrate">
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="25">25%</option>
            <option value="30" selected>30%</option>
            <option value="35">35%</option>
        </select><br><br>
        
        <label>Mode de sélection :</label>
        <input type="radio" id="modeManual" name="mode" value="manual" checked onchange="toggleMode()">
        <label style="width: auto;" for="modeManual">Saisie manuelle</label>
        <input type="radio" id="modeWatchlist" name="mode" value="watchlist" onchange="toggleMode()">
        <label style="width: auto;" for="modeWatchlist">Watchlist complète</label>
        <br><br>
        
        <div id="manualInput">
            <label>Équipes (ex: Lens|F1) :</label>
            <input type="text" id="teams" placeholder="Lens|F1,Mallorca|SP1" style="width: 300px;">
        </div>
        <br>
        <button onclick="runSimulation()">Lancer la simulation</button>
    </div>

    <pre id="resultat">En attente...</pre>

    <script>
        function toggleMode() {
            document.getElementById('manualInput').style.display = document.getElementById('modeManual').checked ? 'block' : 'none';
        }

        async function runSimulation() {
            const roi = document.getElementById('roi').value;
            const wr = document.getElementById('winrate').value;
            let teams = "";

            if (document.getElementById('modeWatchlist').checked) {
                try {
                    const wl = await fetch('/api/watchlist-sync');
                    const data = await wl.json();
                    teams = data.keys.join(',');
                } catch(e) { alert('Erreur chargement watchlist'); return; }
            } else {
                teams = document.getElementById('teams').value;
            }
            
            if(!teams) { alert('Veuillez entrer ou charger des équipes'); return; }

            const url = `/api/watchlist-simulation-v2?teams=${teams}&roiThreshold=${roi}&winRateThreshold=${wr}`;
            document.getElementById('resultat').innerText = "Chargement...";
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                document.getElementById('resultat').innerText = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('resultat').innerText = "Erreur : " + e.message;
            }
        }
    </script>
</body>
</html>
