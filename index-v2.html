  1 <!DOCTYPE html>
    2 <html>
    3 <head>
    4     <meta charset="UTF-8">
    5     <title>Sniper V2</title>
    6 </head>
    7 <body>
    8     <h1>Sniper V2 Configuration</h1>
    9     <div>
   10         <select id="roi"><option value="25">25% ROI</option></select>
   11         <select id="winrate"><option value="30">30% WR</option></select>
   12         <br><br>
   13         <input type="radio" id="modeManual" name="mode" value="manual" checked> <label>Saisie manuelle</label>
   14         <input type="radio" id="modeWatchlist" name="mode" value="watchlist"> <label>Watchlist</label>
   15         <br><br>
   16         <input type="text" id="teams" placeholder="Lens|F1,Mallorca|SP1">
   17         <br><br>
   18         <button id="runBtn">Lancer la simulation</button>
   19     </div>
   20     <pre id="resultat">En attente...</pre>
   21
   22     <script>
   23         document.getElementById('runBtn').addEventListener('click', async function() {
   24             try {
   25                 const roi = document.getElementById('roi').value;
   26                 const wr = document.getElementById('winrate').value;
   27                 let teams = document.getElementById('teams').value;
   28
   29                 if (document.getElementById('modeWatchlist').checked) {
   30                     const wl = await fetch('/api/watchlist-sync');
   31                     const data = await wl.json();
   32                     teams = data.keys.join(',');
   33                 }
   34
   35                 if(!teams) { alert('Entrez des équipes'); return; }
   36
   37                 document.getElementById('resultat').innerText = "Chargement...";
   38                 const res = await
      fetch(`/api/watchlist-simulation-v2?teams=${teams}&roiThreshold=${roi}&winRateThreshold=${wr}`);
   39                 const data = await res.json();
   40                 document.getElementById('resultat').innerText = JSON.stringify(data, null, 2);
   41             } catch (e) {
   42                 document.getElementById('resultat').innerText = "Erreur : " + e.message;
   43             }
   44         });
   45     </script>
   46 </body>
   47 </html>
