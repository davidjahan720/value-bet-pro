1 <!DOCTYPE html>
    2 <html lang="fr">
    3 <head>
    4     <meta charset="UTF-8">
    5     <title>Sniper V2</title>
    6 </head>
    7 <body>
    8     <h1>Configuration</h1>
    9     <select id="roi"><option value="25" selected>ROI 25%</option></select>
   10     <select id="winrate"><option value="30" selected>WR 30%</option></select>
   11     <br><br>
   12     <input type="radio" id="modeManual" name="mode" value="manual" checked> <label>Manuel</label>
   13     <input type="radio" id="modeWatchlist" name="mode" value="watchlist"> <label>Watchlist</label>
   14     <br><br>
   15     <input type="text" id="teams" placeholder="Lens|F1,Mallorca|SP1">
   16     <button id="runBtn">Lancer</button>
   17     <pre id="resultat">En attente...</pre>
   18
   19     <script>
   20         document.getElementById('runBtn').onclick = async () => {
   21             const roi = document.getElementById('roi').value;
   22             const wr = document.getElementById('winrate').value;
   23             let teams = document.getElementById('teams').value;
   24             document.getElementById('resultat').innerText = "Chargement...";
   25
   26             if (document.getElementById('modeWatchlist').checked) {
   27                 const wl = await fetch('/api/watchlist-sync');
   28                 const data = await wl.json();
   29                 teams = data.keys.join(',');
   30             }
   31
   32             const res = await
      fetch(`/api/watchlist-simulation-v2?teams=${teams}&roiThreshold=${roi}&winRateThreshold=${wr}`);
   33             const data = await res.json();
   34             document.getElementById('resultat').innerText = JSON.stringify(data, null, 2);
   35         };
   36     </script>
   37 </body>
   38 </html>
